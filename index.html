<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BNB Builder Session · Santa Cruz</title>
  <style>
    :root {
      --yellow: #f0b90b;
      --ink: #0b0e11;
      --white: #ffffff;
      --muted: #5c6570;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #000;
      color: var(--ink);
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .stage {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
    }
    .slide {
      display: none;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      position: relative;
      padding: 4.2% 4.6% 8%;
      overflow: hidden;
    }
    .slide.on { display: flex; flex-direction: column; }
    .slide.light { background: var(--white); color: var(--ink); }
    .slide.dark { background: var(--ink); color: var(--white); }
    .logo { height: 28px; width: auto; }
    h1 {
      font-size: clamp(36px, 4.4vw, 72px);
      line-height: 0.98;
      letter-spacing: -0.03em;
      font-weight: 750;
    }
    h2 {
      font-size: clamp(26px, 2.6vw, 42px);
      letter-spacing: -0.03em;
      font-weight: 750;
      line-height: 1.05;
    }
    .sub { margin-top: 0.6vh; font-size: clamp(15px, 1.25vw, 20px); }
    .kicker {
      color: var(--yellow);
      font-weight: 750;
      letter-spacing: 0.08em;
      font-size: clamp(12px, 1vw, 16px);
      margin-bottom: 1.2vh;
    }
    .stack { display: flex; flex-direction: column; gap: 1.2vh; margin-top: 2vh; flex: 1; }
    .row, .grid { display: grid; gap: 1.1vw; }
    .g2 { grid-template-columns: 1fr 1fr; }
    .g3 { grid-template-columns: 1fr 1fr 1fr; }
    .g4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
    .g5 { grid-template-columns: repeat(5, 1fr); }
    .card {
      background: var(--ink);
      color: var(--white);
      border-radius: 14px;
      padding: 1.4vh 1.1vw;
    }
    .card h3 { color: var(--yellow); font-size: clamp(16px, 1.35vw, 24px); margin-bottom: 0.4vh; }
    .card p, .card li { font-size: clamp(13px, 1.05vw, 18px); line-height: 1.35; }
    .card strong { color: var(--yellow); }
    .quiet { color: rgba(255,255,255,0.82); }
    .gold { color: var(--yellow); }
    code, .mono {
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 0.92em;
    }
    pre {
      background: var(--ink);
      color: var(--white);
      border-radius: 12px;
      padding: 1.2vh 1vw;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: clamp(12px, 1.05vw, 17px);
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .step {
      display: grid;
      grid-template-columns: 28% 1fr;
      gap: 2vw;
      flex: 1;
      min-height: 0;
    }
    .step.flip { grid-template-columns: 1fr 28%; }
    .step.flip .panel { order: 2; }
    .panel {
      background: var(--ink);
      color: var(--white);
      border-radius: 18px;
      padding: 3vh 1.4vw;
    }
    .panel .num {
      color: var(--yellow);
      font-size: clamp(64px, 7vw, 110px);
      font-weight: 750;
      line-height: 0.85;
      letter-spacing: -0.04em;
    }
    .panel h2 { color: var(--white); margin-top: 1vh; }
    .beats { display: flex; flex-direction: column; gap: 0.8vh; margin-top: 2vh; }
    .beat {
      display: grid;
      grid-template-columns: auto 11vw 1fr;
      gap: 1vw;
      align-items: center;
      background: var(--ink);
      color: var(--white);
      border-radius: 12px;
      padding: 0.9vh 1vw;
    }
    .badge {
      width: 1.7vw;
      min-width: 26px;
      height: 1.7vw;
      min-height: 26px;
      border-radius: 50%;
      background: var(--yellow);
      color: var(--ink);
      font-weight: 750;
      display: grid;
      place-items: center;
      font-size: clamp(13px, 1vw, 16px);
    }
    .cover-box {
      margin-top: auto;
      background: #16181c;
      border-radius: 16px;
      padding: 2vh 1.6vw;
      max-width: 42vw;
      font-size: clamp(16px, 1.35vw, 22px);
      line-height: 1.4;
    }
    .qr-row { display: flex; gap: 1.2vw; }
    .qr {
      background: var(--white);
      border-radius: 10px;
      padding: 0.4vh;
      width: min(18vh, 9vw);
    }
    .qr img { width: 100%; height: auto; display: block; }
    .qr figcaption { color: var(--white); text-align: center; font-size: clamp(11px, 0.85vw, 14px); margin-top: 0.4vh; }
    .foot {
      position: absolute;
      left: 4.6%;
      right: 4.6%;
      bottom: 3.2%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .count { font-variant-numeric: tabular-nums; font-size: 14px; opacity: 0.55; }
    #notes {
      display: none;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: #111;
      color: #eee;
      padding: 12px 20px 16px;
      font-size: 15px;
      line-height: 1.35;
      z-index: 5;
      max-height: 22vh;
      overflow: auto;
    }
    body.notes-on #notes { display: block; }
    #help {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.82);
      color: white;
      z-index: 6;
      place-items: center;
    }
    body.help-on #help { display: grid; }
    #help div { font-size: 22px; line-height: 1.7; }
    a { color: var(--yellow); }
  </style>
</head>

    const stage = document.getElementById("stage");
    const notesEl = document.getElementById("notes");
    slides.forEach((s) => {
      const wrap = document.createElement("div");
      wrap.innerHTML = s.html.trim();
      stage.appendChild(wrap.firstElementChild);
    });
    let i = 0;
    const nodes = [...stage.querySelectorAll(".slide")];
    function show(n) {
      i = Math.max(0, Math.min(nodes.length - 1, n));
      nodes.forEach((el, idx) => {
        el.classList.toggle("on", idx === i);
        const num = el.querySelector(".count");
        if (num) num.textContent = String(idx + 1).padStart(2, "0") + " / " + String(nodes.length).padStart(2, "0");
      });
      notesEl.textContent = slides[i].notes;
      location.hash = String(i + 1);
    }
    function parseHash() {
      const n = parseInt(location.hash.replace("#", ""), 10);
      show(Number.isFinite(n) ? n - 1 : 0);
    }
    window.addEventListener("hashchange", parseHash);
    parseHash();
    document.addEventListener("keydown", (e) => {
      if (["INPUT", "TEXTAREA"].includes(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); show(i + 1); }
      else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(i - 1); }
      else if (e.key === "Home") show(0);
      else if (e.key === "End") show(nodes.length - 1);
      else if (e.key === "s" || e.key === "S") document.body.classList.toggle("notes-on");
      else if (e.key === "f" || e.key === "F") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      } else if (e.key === "h" || e.key === "H" || e.key === "?") document.body.classList.toggle("help-on");
      else if (e.key === "Escape") document.body.classList.remove("help-on");
    });
  </script>
